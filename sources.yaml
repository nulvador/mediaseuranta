  # ================= GOLFLIITOT — POHJOISMAAT =================
  - id: sgf_sweden
    name: Svenska Golfförbundet (SGF)
    tab: golfliitot
    country: Ruotsi
    language: sv
    # SGF siirtyi Cisionista TT:n pressihuoneeseen — Cision-sivun tuorein tiedote
    # oli 5/2025. golf.se on JS-renderöity staattinen infosivusto ilman uutisosiota
    # (ei RSS:ää, ei /nyheter-polkua), joten TT:n syöte on SGF:n ainoa uutisreitti.
    # publisherId 3237066 = Svenska Golfförbundet (golf.se/pressrum upottaa saman).
    # google_news: golf.se poistettu: site:-haku tuotti 77 muun median juttua eikä
    # yhtään SGF:n omaa — pelkkää melua lähdeterveystaulukossa.
    rss: https://via.tt.se/rss/releases/latest?publisherId=3237066

  - id: dgu_denmark
    name: Dansk Golf Union (DGU)
    tab: golfliitot
    country: Tanska
    language: da
    # Oletusselektorit osuivat vain yhteen <article>-elementtiin (koko sivun runko)
    # eivätkä löytäneet päivämäärää -> lähde tuotti yhden päivämäärättömän jutun,
    # joka näkyi raportissa aina tuoreena. Jokainen tiedote on <a>, jonka sisällä
    # .dgu-teaser; päivämäärä on muodossa "19/06-2026".
    html:
      url: https://www.danskgolfunion.dk/pressemeddelelser
      selectors:
        container: ["a:has(.dgu-teaser)"]
        title: ["h2.dgu-teaser__title", ".dgu-teaser__title", "h2", "h3"]
        date: ["div.dgu-teaser__show", ".dgu-teaser__show"]
        summary: [".dgu-teaser__text", "p"]
    google_news: danskgolfunion.dk

  - id: ngf_norway
    name: Norges Golfforbund (NGF)
    tab: golfliitot
    country: Norja
    language: "no"
    # Ei RSS-syötettä (tarkistettu 7/2026). Pressitiedotearkisto renderöityy
    # palvelimella: jokainen tiedote on <a class="col-md-6 ...">, jonka sisällä
    # pvm <p class="small">, otsikko <h6> ja ingressi <p>.
    html:
      url: https://www.golfforbundet.no/om/presse/pressemeldinger
      selectors:
        container: ["a.col-md-6", "a[class*=col-]"]
        title: ["h6", "h5", "h4"]
        date: ["p.small", ".small"]
        summary: ["p:nth-of-type(2)", "p"]
    google_news: golfforbundet.no

  - id: gsi_iceland
    name: Golfsamband Íslands (GSÍ)
    tab: golfliitot
    country: Islanti
    language: is
    # Elementor-teema: päivämäärä on span.elementor-post-date, jota oletusselektorit
    # eivät löytäneet -> jutut näkyivät päivämäärättöminä eli aina tuoreina.
    html:
      url: https://www.golf.is/frettir/
      selectors:
        date: ["span.elementor-post-date", ".elementor-post-date", "time", ".date"]
    google_news: golf.is

  - id: sterf
    name: STERF (Scandinavian Turfgrass Research)
    tab: golfliitot
    country: Pohjoismaat
    language: en
    # HTML-varareitti poistettu: sterf.org/news/ listaa jutut ilman päivämääriä,
    # ja päivämäärätön artikkeli tulkitaan tuoreeksi -> vanhat tutkimusuutiset
    # nousisivat raporttiin uusina. RSS toimii ja sisältää oikeat päivämäärät;
    # STERF julkaisee harvoin, joten hiljaiset jaksot ovat normaaleja.
    rss: https://sterf.org/feed/

  # ================= GOLFLIITOT — EUROOPPA =================
  - id: ega
    name: European Golf Association (EGA)
    tab: golfliitot
    country: Eurooppa
    language: en
    # Drupal-sivusto, jolla /news-and-media sisältää kolme erillistä näkymää:
    # uutiset, kuvagalleriat ja videot. Container on rajattava uutisnäkymään,
    # muuten mukaan tulee "Photo Gallery"- ja "Video"-rivejä. Oletuslistan
    # 'article' osui täällä 18 kuvaelementtiin (media--type-image), mistä tuli
    # loki "18 puutteellista".
    html:
      url: https://www.ega-golf.ch/news-and-media
      selectors:
        container: ['.view-display-id-attachment_news_all .views-row']
        title: ['h2', 'h3']
        # Luokka on 'news-page-item__small-date', ei 'date' — oletuslistan
        # date-selektorit eivät osu, jolloin juttu jäisi päivämäärättömäksi ja
        # tulkittaisiin ikuisesti tuoreeksi.
        date: ['.news-page-item__small-date', '.field--name-field-date']
        summary: ['p']
    google_news: ega-golf.ch

  - id: england_golf
    name: England Golf
    tab: golfliitot
    country: Englanti
    language: en
    rss: https://www.englandgolf.org/feed/
    html:
      url: https://www.englandgolf.org/news/
    google_news: englandgolf.org

  - id: scottish_golf
    name: Scottish Golf
    tab: golfliitot
    country: Skotlanti
    language: en
    # RSS ei vastaa ja uutissivu on JS-renderöity -> vain Google News
    google_news: scottishgolf.org

  - id: golf_ireland
    name: Golf Ireland
    tab: golfliitot
    country: Irlanti
    language: en
    # HTML-reitti poistettu 7/2026: golfireland.ie/news on Knockout-templaatti,
    # jonka uutiskortit ovat tyhjiä runkoja (linkki "#!", otsikoksi valikoitui CMS:n
    # "Edit Article"). Lähde näytti tuottavan 8 juttua, jotka olivat kaikki roskaa.
    # Oikea sisältö tulee POST-APIsta /api/news/GetNewsArticles (clubWebsiteId +
    # pageSize), jota fetch.py ei tue -> toistaiseksi vain Google News.
    google_news: golfireland.ie

  - id: dgv_germany
    name: Deutscher Golf Verband (DGV)
    tab: golfliitot
    country: Saksa
    language: de
    html:
      url: https://www.golf.de/publish/dgv-aktuell/
    google_news: golf.de

  - id: ffgolf
    name: Fédération française de golf
    tab: golfliitot
    country: Ranska
    language: fr
    html:
      url: https://www.ffgolf.org/Actus
    google_news: ffgolf.org

  - id: ngf_netherlands
    name: Nederlandse Golf Federatie (NGF)
    tab: golfliitot
    country: Hollanti
    language: nl
    # RSS löytyi lopulta polusta /nieuws/feed (ei /feed eikä /rss). Syöte antaa
    # oikeat päivämäärät, mutta sen <link> on rikki: skeema on ilman
    # kaksoispistettä ("https//www.ngf.nl/…"), joten feedparser liimaa base-URLin
    # eteen. fetch.repair_link korjaa tämän — tarkistettu, että kaikki linkit
    # avautuvat. Google News jää varareitiksi.
    rss: https://www.ngf.nl/nieuws/feed
    google_news: ngf.nl

  - id: rfeg_spain
    name: Real Federación Española de Golf
    tab: golfliitot
    country: Espanja
    language: es
    html:
      url: https://www.rfegolf.es/Noticias
    google_news: rfegolf.es

  - id: fig_italy
    name: Federazione Italiana Golf (FIG)
    tab: golfliitot
    country: Italia
    language: it
    # JegTheme: päivämäärä on div.jeg_meta_date ("26 Luglio 2026"), jota
    # oletusselektorit eivät löytäneet -> jutut näkyivät aina tuoreina.
    html:
      url: https://www.federgolf.it/news/
      selectors:
        date: ["div.jeg_meta_date", ".jeg_meta_date", "time", ".date"]
    google_news: federgolf.it

  - id: ogv_austria
    name: Österreichischer Golf-Verband (ÖGV)
    tab: golfliitot
    country: Itävalta
    language: de
    rss: https://www.golf.at/feed/
    html:
      url: https://www.golf.at/news/
    google_news: golf.at

  - id: swiss_golf
    name: Swiss Golf
    tab: golfliitot
    country: Sveitsi
    language: de-ch
    # swissgolf.ch/rss on käyttökelvoton: merkinnöistä puuttuu <link> kokonaan
    # (vain guid "swissgolf-news-de-1921"), joten artikkeliin ei pääse.
    # Uutislistaus renderöityy palvelimella ja antaa oikeat URL:t ja päivämäärät.
    # Container .CardTeaserSplit rajaa juuri uutiskortit: pelkkä .etx-card osuisi
    # myös sisäkkäisiin kortteihin (jutut kaksin kappalein) ja uutiskirjenostoon.
    html:
      url: https://swissgolf.ch/de/news-magazin/news/
      selectors:
        container: [".CardTeaserSplit"]
        title: ["h3", "h2", "h4"]
        date: ["p.font-color-medium", ".font-color-medium"]
        summary: ["p.etx-text-crop", ".etx-text-crop"]
    google_news_query: 'site:swissgolf.ch'

  - id: estonian_golf
    name: Eesti Golfi Liit
    tab: golfliitot
    country: Viro
    language: et
    html:
      url: https://golf.ee/uudised/
    google_news: golf.ee

  - id: pzg_poland
    name: Polski Związek Golfa (PZG)
    tab: golfliitot
    country: Puola
    language: pl
    # pzgolf.pl on muuttanut osoitteeseen polski.golf — RSS toimii siellä.
    rss: https://polski.golf/feed
    google_news: polski.golf

  # ================= GOLFLIITOT — KANSAINVÄLISET =================
  - id: randa
    name: The R&A
    tab: golfliitot
    country: Kansainvälinen
    language: en
    # Vain R&A:n oma sivusto. Ei RSS:ää, ja /news/all-news renderöityy JS:llä
    # ilman päivämääriä (tarkistettu 7/2026) -> HTML-reitti ei ole mahdollinen.
    # Google News indeksoi randa.org:n, joten lähde herää kun R&A julkaisee.
    google_news: randa.org

  - id: theopen
    name: The Open (virallinen)
    tab: golfliitot
    country: Kansainvälinen
    language: en
    google_news: theopen.com

  - id: usga
    name: USGA
    tab: golfliitot
    country: USA
    language: en
    google_news: usga.org
